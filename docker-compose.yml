services:
  # Load environment variables from .env.local
  # This ensures all services get the correct API keys and configuration

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: libancom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-libancom}
    ports:
      - "${POSTGRES_PORT:-5483}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: libancom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6383}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit for local email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: libancom-mailpit
    restart: unless-stopped
    ports:
      - "8029:8025"   # Web UI
      - "1029:1025"   # SMTP server
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
