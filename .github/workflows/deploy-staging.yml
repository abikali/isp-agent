name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coolify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    environment: staging

    steps:
      # Coolify builds the image from the repo on the node and rolls the
      # containers itself, so CI only has to trigger the deploy. Web and worker
      # build from the same repo (different start commands) — deploy both in one
      # call via comma-separated UUIDs. A failed Coolify build leaves the running
      # container untouched, so an explicit trigger is safe.
      - name: Trigger Coolify deploy (web + worker)
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
          WORKER_UUID: ${{ vars.COOLIFY_WORKER_UUID }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${WEB_UUID},${WORKER_UUID}"
